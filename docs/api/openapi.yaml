openapi: 3.1.0
info:
  title: Hospital HIS API
  version: 0.1.0
  description: 第一阶段并行开发接口契约。所有受保护接口使用 Bearer JWT。
servers:
  - url: http://localhost:8090
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Platform
  - name: MasterData
  - name: Registration
  - name: Outpatient
  - name: MedicalTech
  - name: Pharmacy
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 用户登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/me:
    get:
      tags: [Auth]
      summary: 获取当前用户
      operationId: currentUser
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileEnvelope'
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      description: JWT 为无状态令牌，服务端返回成功，客户端删除令牌。
      operationId: logout
      responses:
        '204':
          description: 已退出
  /api/master-data/departments:
    get:
      tags: [MasterData]
      summary: 分页查询科室
      operationId: listDepartments
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/DepartmentType'
        - name: active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 科室分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentPageEnvelope'
    post:
      tags: [MasterData]
      summary: 创建科室
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
      responses:
        '200':
          description: 已创建科室
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/master-data/departments/{departmentId}:
    put:
      tags: [MasterData]
      summary: 更新科室
      operationId: updateDepartment
      parameters:
        - $ref: '#/components/parameters/DepartmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
      responses:
        '200':
          description: 已更新科室
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/master-data/departments/{departmentId}/active:
    patch:
      tags: [MasterData]
      summary: 启用或停用科室
      operationId: changeDepartmentActive
      parameters:
        - $ref: '#/components/parameters/DepartmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentActiveRequest'
      responses:
        '200':
          description: 已变更科室状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/master-data/employees:
    get:
      tags: [MasterData]
      summary: 查询有效员工
      operationId: listEmployees
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: departmentId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
  /api/master-data/{resource}:
    get:
      tags: [MasterData]
      summary: 查询其他基础数据
      description: resource 可为 regist-levels、settle-categories、diseases、medical-technologies、drugs。
      operationId: listMasterData
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [regist-levels, settle-categories, diseases, medical-technologies, drugs]
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
  /api/master-data/employees/manage:
    get:
      tags: [MasterData]
      summary: 分页维护员工
      operationId: searchManagedEmployees
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: departmentId
          in: query
          schema: { type: integer, format: int64 }
        - name: active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 员工分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePageEnvelope' }
    post:
      tags: [MasterData]
      summary: 创建员工
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeRequest' }
      responses:
        '200':
          description: 已创建员工
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/master-data/employees/manage/{employeeId}:
    put:
      tags: [MasterData]
      summary: 更新员工
      operationId: updateEmployee
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeRequest' }
      responses:
        '200':
          description: 已更新员工
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/master-data/employees/manage/{employeeId}/active:
    patch:
      tags: [MasterData]
      summary: 启用或停用员工
      operationId: changeEmployeeActive
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentActiveRequest' }
      responses:
        '200':
          description: 已变更员工状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeEnvelope' }
  /api/master-data/diseases/manage:
    get:
      tags: [MasterData]
      summary: 分页维护疾病
      operationId: searchManagedDiseases
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 疾病分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiseasePageEnvelope' }
    post:
      tags: [MasterData]
      summary: 创建疾病
      operationId: createDisease
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiseaseRequest' }
      responses:
        '200':
          description: 已创建疾病
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiseaseEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/master-data/diseases/manage/{resourceId}:
    put:
      tags: [MasterData]
      summary: 更新疾病
      operationId: updateDisease
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiseaseRequest' }
      responses:
        '200':
          description: 已更新疾病
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiseaseEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/master-data/diseases/manage/{resourceId}/active:
    patch:
      tags: [MasterData]
      summary: 启用或停用疾病
      operationId: changeDiseaseActive
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentActiveRequest' }
      responses:
        '200':
          description: 已变更疾病状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiseaseEnvelope' }
  /api/master-data/drugs/manage:
    get:
      tags: [MasterData]
      summary: 分页维护药品
      operationId: searchManagedDrugs
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 药品分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrugPageEnvelope' }
    post:
      tags: [MasterData]
      summary: 创建药品
      operationId: createDrug
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DrugRequest' }
      responses:
        '200':
          description: 已创建药品
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrugEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/master-data/drugs/manage/{resourceId}:
    put:
      tags: [MasterData]
      summary: 更新药品
      operationId: updateDrug
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DrugRequest' }
      responses:
        '200':
          description: 已更新药品
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrugEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/master-data/drugs/manage/{resourceId}/active:
    patch:
      tags: [MasterData]
      summary: 启用或停用药品
      operationId: changeDrugActive
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentActiveRequest' }
      responses:
        '200':
          description: 已变更药品状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrugEnvelope' }
  /api/master-data/medical-technologies/manage:
    get:
      tags: [MasterData]
      summary: 分页维护医技项目
      operationId: searchManagedMedicalTechnologies
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 医技项目分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalTechnologyPageEnvelope' }
    post:
      tags: [MasterData]
      summary: 创建医技项目
      operationId: createMedicalTechnology
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicalTechnologyRequest' }
      responses:
        '200':
          description: 已创建医技项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalTechnologyEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/master-data/medical-technologies/manage/{resourceId}:
    put:
      tags: [MasterData]
      summary: 更新医技项目
      operationId: updateMedicalTechnology
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicalTechnologyRequest' }
      responses:
        '200':
          description: 已更新医技项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalTechnologyEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/master-data/medical-technologies/manage/{resourceId}/active:
    patch:
      tags: [MasterData]
      summary: 启用或停用医技项目
      operationId: changeMedicalTechnologyActive
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentActiveRequest' }
      responses:
        '200':
          description: 已变更医技项目状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalTechnologyEnvelope' }
  /api/master-data/scheduling/manage:
    get:
      tags: [MasterData]
      summary: 分页维护排班规则
      operationId: searchManagedScheduling
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 排班规则分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingPageEnvelope' }
    post:
      tags: [MasterData]
      summary: 创建排班规则
      operationId: createScheduling
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulingRequest' }
      responses:
        '200':
          description: 已创建排班规则
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingEnvelope' }
  /api/master-data/scheduling/manage/{resourceId}:
    put:
      tags: [MasterData]
      summary: 更新排班规则
      operationId: updateScheduling
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulingRequest' }
      responses:
        '200':
          description: 已更新排班规则
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/master-data/scheduling/manage/{resourceId}/active:
    patch:
      tags: [MasterData]
      summary: 启用或停用排班规则
      operationId: changeSchedulingActive
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentActiveRequest' }
      responses:
        '200':
          description: 已变更排班规则状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingEnvelope' }
  /api/platform/roles:
    get:
      tags: [Platform]
      summary: 查询平台角色
      operationId: listPlatformRoles
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleListEnvelope' }
  /api/platform/users:
    get:
      tags: [Platform]
      summary: 分页查询平台账号
      operationId: searchPlatformUsers
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: enabled
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 平台账号分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccountPageEnvelope' }
    post:
      tags: [Platform]
      summary: 创建平台账号
      operationId: createPlatformUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '200':
          description: 已创建平台账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccountEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/platform/users/{userId}:
    put:
      tags: [Platform]
      summary: 更新平台账号
      operationId: updatePlatformUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: 已更新平台账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccountEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/platform/users/{userId}/enabled:
    patch:
      tags: [Platform]
      summary: 启用或停用平台账号
      operationId: changePlatformUserEnabled
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserEnabledRequest' }
      responses:
        '200':
          description: 已变更平台账号状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccountEnvelope' }
  /api/platform/operation-logs:
    get:
      tags: [Platform]
      summary: 分页查询操作日志
      operationId: searchOperationLogs
      parameters:
        - name: moduleCode
          in: query
          schema: { type: string, maxLength: 64 }
        - name: action
          in: query
          schema: { type: string, maxLength: 64 }
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 操作日志分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationLogPageEnvelope' }
  /api/registration/case-numbers:
    post:
      tags: [Registration]
      summary: 生成病历号
      operationId: generateCaseNumber
      responses:
        '200':
          description: 新病历号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringEnvelope'
  /api/registrations:
    post:
      tags: [Registration]
      summary: 创建挂号
      operationId: createRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegistrationRequest'
      responses:
        '200':
          description: 挂号结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationEnvelope'
    get:
      tags: [Registration]
      summary: 分页查询挂号
      operationId: searchRegistrations
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/VisitState' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
  /api/registrations/{registrationId}/cancel:
    post:
      tags: [Registration]
      summary: 退号
      operationId: cancelRegistration
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '204': { description: 已退号 }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/registrations/{registrationId}/charge-items:
    get:
      tags: [Registration]
      summary: 查询就诊收费明细
      operationId: listChargeItems
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ChargeItemState' }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
  /api/payments:
    post:
      tags: [Registration]
      summary: 收费结算
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRequest' }
      responses:
        '200':
          description: 支付流水
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentEnvelope' }
  /api/refunds:
    post:
      tags: [Registration]
      summary: 退费
      operationId: createRefund
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundRequest' }
      responses:
        '200':
          description: 退款流水
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentEnvelope' }
  /api/outpatient/patients:
    get:
      tags: [Outpatient]
      summary: 查询当前医生患者队列
      operationId: listDoctorPatients
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/VisitState' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
  /api/registrations/{registrationId}/medical-record:
    put:
      tags: [Outpatient]
      summary: 创建或更新病历首页
      operationId: saveMedicalRecord
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicalRecordRequest' }
      responses:
        '200':
          description: 病历
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalRecordEnvelope' }
  /api/registrations/{registrationId}/medical-orders:
    post:
      tags: [Outpatient]
      summary: 开立检查、检验或处置申请
      operationId: createMedicalOrders
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/CreateMedicalOrderRequest' }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
  /api/registrations/{registrationId}/prescriptions:
    post:
      tags: [Outpatient]
      summary: 开立处方
      operationId: createPrescriptions
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/CreatePrescriptionRequest' }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
  /api/registrations/{registrationId}/complete:
    post:
      tags: [Outpatient]
      summary: 完成本次看诊
      operationId: completeConsultation
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '204': { description: 看诊完成 }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/medical-orders:
    get:
      tags: [MedicalTech]
      summary: 查询医技申请队列
      operationId: searchMedicalOrders
      parameters:
        - name: type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/MedicalOrderType' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/MedicalOrderState' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
  /api/medical-orders/{type}/{orderId}/accept:
    post:
      tags: [MedicalTech]
      summary: 接收医技申请
      operationId: acceptMedicalOrder
      parameters:
        - $ref: '#/components/parameters/MedicalOrderType'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '204': { description: 已接收 }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/medical-orders/{type}/{orderId}/result:
    post:
      tags: [MedicalTech]
      summary: 录入医技执行结果
      operationId: reportMedicalOrderResult
      parameters:
        - $ref: '#/components/parameters/MedicalOrderType'
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicalOrderResultRequest' }
      responses:
        '204': { description: 结果已保存 }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/pharmacy/prescriptions:
    get:
      tags: [Pharmacy]
      summary: 查询发药或退药队列
      operationId: searchPharmacyPrescriptions
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/PrescriptionState' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
  /api/pharmacy/prescriptions/{prescriptionId}/dispense:
    post:
      tags: [Pharmacy]
      summary: 发药并扣减库存
      operationId: dispensePrescription
      parameters:
        - $ref: '#/components/parameters/PrescriptionId'
      responses:
        '204': { description: 发药完成 }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/pharmacy/prescriptions/{prescriptionId}/return:
    post:
      tags: [Pharmacy]
      summary: 退药并恢复库存
      operationId: returnPrescription
      parameters:
        - $ref: '#/components/parameters/PrescriptionId'
      responses:
        '204': { description: 退药完成 }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Keyword:
      name: keyword
      in: query
      schema: { type: string, maxLength: 64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MedicalOrderType:
      name: type
      in: path
      required: true
      schema: { $ref: '#/components/schemas/MedicalOrderType' }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PrescriptionId:
      name: prescriptionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Unauthorized:
      description: 未登录或令牌无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 业务状态冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: 参数格式或必填项错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 业务对象不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ListResponse:
      description: 列表响应
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/BaseResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
    PageResponse:
      description: 分页响应
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/BaseResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/PageData' }
  schemas:
    BaseResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code: { type: string, examples: [OK] }
        message: { type: string, examples: [success] }
        timestamp: { type: string, format: date-time }
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { type: 'null' }
    PageData:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 128, format: password }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: 有效秒数 }
        user: { $ref: '#/components/schemas/UserProfile' }
    LoginResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/LoginResponse' }
    UserProfile:
      type: object
      required: [id, username, displayName, roles, permissions]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        employeeId: { type: [integer, 'null'], format: int64 }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    UserProfileEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/UserProfile' }
    StringEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { type: string }
    VisitState:
      type: string
      enum: [REGISTERED, IN_CONSULTATION, COMPLETED, CANCELLED]
    MedicalOrderType:
      type: string
      enum: [CHECK, INSPECTION, DISPOSAL]
    MedicalOrderState:
      type: string
      enum: [CREATED, PAID, ACCEPTED, EXECUTED, RESULT_REPORTED, REFUNDED, CANCELLED]
    PrescriptionState:
      type: string
      enum: [CREATED, PAID, DISPENSED, RETURNED, REFUNDED, CANCELLED]
    ChargeItemState:
      type: string
      enum: [UNPAID, PAID, REFUNDED, VOID]
    DepartmentType:
      type: string
      enum: [OUTPATIENT, CHECK, INSPECTION, DISPOSAL, FINANCE, PHARMACY]
    DepartmentRequest:
      type: object
      required: [code, name, type, active]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 64 }
        type: { $ref: '#/components/schemas/DepartmentType' }
        active: { type: boolean }
    DepartmentActiveRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    Department:
      allOf:
        - $ref: '#/components/schemas/DepartmentRequest'
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }
    DepartmentEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Department' }
    DepartmentPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageData'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/Department' }
    EmployeeRequest:
      type: object
      required: [realName, departmentId, active]
      properties:
        realName: { type: string, maxLength: 64 }
        departmentId: { type: integer, format: int64 }
        registLevelId: { type: [integer, 'null'], format: int64 }
        schedulingId: { type: [integer, 'null'], format: int64 }
        active: { type: boolean }
    Employee:
      allOf:
        - $ref: '#/components/schemas/EmployeeRequest'
        - type: object
          required: [id, departmentName]
          properties:
            id: { type: integer, format: int64 }
            departmentName: { type: string }
            registLevelName: { type: [string, 'null'] }
    EmployeeEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Employee' }
    EmployeePageEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageData'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/Employee' }
    DiseaseRequest:
      type: object
      required: [code, name, active]
      properties:
        code: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 255 }
        icd: { type: [string, 'null'], maxLength: 50 }
        category: { type: [string, 'null'], maxLength: 50 }
        active: { type: boolean }
    Disease:
      allOf:
        - $ref: '#/components/schemas/DiseaseRequest'
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }
    DiseaseEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Disease' }
    DiseasePageEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageData'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/Disease' }
    DrugRequest:
      type: object
      required: [code, name, format, unit, price, active]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        format: { type: string, maxLength: 255 }
        unit: { type: string, maxLength: 16 }
        manufacturer: { type: [string, 'null'], maxLength: 255 }
        dosage: { type: [string, 'null'], maxLength: 64 }
        type: { type: [string, 'null'], maxLength: 64 }
        price: { type: number, minimum: 0, multipleOf: 0.01 }
        mnemonicCode: { type: [string, 'null'], maxLength: 64 }
        active: { type: boolean }
    Drug:
      allOf:
        - $ref: '#/components/schemas/DrugRequest'
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }
    DrugEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Drug' }
    DrugPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageData'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/Drug' }
    MedicalTechnologyRequest:
      type: object
      required: [code, name, price, type, departmentId, active]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        format: { type: [string, 'null'], maxLength: 64 }
        price: { type: number, minimum: 0, multipleOf: 0.01 }
        type: { type: string, maxLength: 32 }
        priceType: { type: [string, 'null'], maxLength: 64 }
        departmentId: { type: integer, format: int64 }
        active: { type: boolean }
    MedicalTechnology:
      allOf:
        - $ref: '#/components/schemas/MedicalTechnologyRequest'
        - type: object
          required: [id, departmentName]
          properties:
            id: { type: integer, format: int64 }
            departmentName: { type: string }
    MedicalTechnologyEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MedicalTechnology' }
    MedicalTechnologyPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageData'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/MedicalTechnology' }
    SchedulingRequest:
      type: object
      required: [name, weekRule, active]
      properties:
        name: { type: string, maxLength: 64 }
        weekRule: { type: string, pattern: '^[01]{14}$' }
        active: { type: boolean }
    Scheduling:
      allOf:
        - $ref: '#/components/schemas/SchedulingRequest'
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }
    SchedulingEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Scheduling' }
    SchedulingPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageData'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/Scheduling' }
    Role:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    RoleListEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Role' }
    CreateUserRequest:
      type: object
      required: [username, password, displayName, enabled, roleCodes]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 128, format: password }
        displayName: { type: string, maxLength: 64 }
        employeeId: { type: [integer, 'null'], format: int64 }
        enabled: { type: boolean }
        roleCodes:
          type: array
          minItems: 1
          items: { type: string, maxLength: 64 }
    UpdateUserRequest:
      type: object
      required: [displayName, enabled, roleCodes]
      properties:
        displayName: { type: string, maxLength: 64 }
        employeeId: { type: [integer, 'null'], format: int64 }
        enabled: { type: boolean }
        roleCodes:
          type: array
          minItems: 1
          items: { type: string, maxLength: 64 }
    UserEnabledRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    UserAccount:
      type: object
      required: [id, username, displayName, enabled, roles]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        employeeId: { type: [integer, 'null'], format: int64 }
        employeeName: { type: [string, 'null'] }
        enabled: { type: boolean }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    UserAccountEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/UserAccount' }
    UserAccountPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageData'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/UserAccount' }
    OperationLog:
      type: object
      required: [id, moduleCode, action, targetType, targetId, detail, createdAt]
      properties:
        id: { type: integer, format: int64 }
        operatorId: { type: [integer, 'null'], format: int64 }
        moduleCode: { type: string }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        detail: { type: string }
        createdAt: { type: string, format: date-time }
    OperationLogPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageData'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/OperationLog' }
    PaymentMethod:
      type: string
      enum: [CASH, BANK_CARD, WECHAT, ALIPAY, MEDICAL_INSURANCE]
    CreateRegistrationRequest:
      type: object
      required: [caseNumber, realName, gender, visitDate, noon, departmentId, employeeId, registLevelId, settleCategoryId, registMethod]
      properties:
        caseNumber: { type: string, maxLength: 64 }
        realName: { type: string, maxLength: 64 }
        gender: { type: string, enum: [MALE, FEMALE, UNKNOWN] }
        cardNumber: { type: string, maxLength: 32 }
        birthday: { type: string, format: date }
        age: { type: integer, minimum: 0 }
        ageType: { type: string, enum: [YEAR, DAY] }
        homeAddress: { type: string, maxLength: 255 }
        visitDate: { type: string, format: date-time }
        noon: { type: string, enum: [AM, PM] }
        departmentId: { type: integer, format: int64 }
        employeeId: { type: integer, format: int64 }
        registLevelId: { type: integer, format: int64 }
        settleCategoryId: { type: integer, format: int64 }
        isBook: { type: boolean, default: false }
        registMethod: { $ref: '#/components/schemas/PaymentMethod' }
    Registration:
      allOf:
        - $ref: '#/components/schemas/CreateRegistrationRequest'
        - type: object
          required: [id, state, registMoney]
          properties:
            id: { type: integer, format: int64 }
            state: { $ref: '#/components/schemas/VisitState' }
            registMoney: { type: number, multipleOf: 0.01 }
    RegistrationEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Registration' }
    MedicalRecordRequest:
      type: object
      required: [chiefComplaint]
      properties:
        chiefComplaint: { type: string, maxLength: 500 }
        presentIllness: { type: string }
        presentTreatment: { type: string }
        pastHistory: { type: string }
        allergyHistory: { type: string }
        physicalExamination: { type: string }
        examinationProposal: { type: string }
        precaution: { type: string }
        diagnosis: { type: string }
        treatmentPlan: { type: string }
        diseaseIds:
          type: array
          uniqueItems: true
          items: { type: integer, format: int64 }
    MedicalRecordEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/MedicalRecordRequest'
                - type: object
                  properties:
                    id: { type: integer, format: int64 }
    CreateMedicalOrderRequest:
      type: object
      required: [type, medicalTechnologyId]
      properties:
        type: { $ref: '#/components/schemas/MedicalOrderType' }
        medicalTechnologyId: { type: integer, format: int64 }
        requestInfo: { type: string, maxLength: 1000 }
        bodyPosition: { type: string, maxLength: 255 }
        remark: { type: string, maxLength: 1000 }
    MedicalOrderResultRequest:
      type: object
      required: [result]
      properties:
        result: { type: string, minLength: 1 }
        remark: { type: string, maxLength: 1000 }
    CreatePrescriptionRequest:
      type: object
      required: [drugId, drugUsage, drugNumber]
      properties:
        drugId: { type: integer, format: int64 }
        drugUsage: { type: string, maxLength: 500 }
        drugNumber: { type: integer, minimum: 1 }
    PaymentRequest:
      type: object
      required: [registrationId, chargeItemIds, paymentMethod, idempotencyKey]
      properties:
        registrationId: { type: integer, format: int64 }
        chargeItemIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, format: int64 }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        idempotencyKey: { type: string, maxLength: 64 }
    RefundRequest:
      type: object
      required: [originalTransactionId, chargeItemIds, reason, idempotencyKey]
      properties:
        originalTransactionId: { type: integer, format: int64 }
        chargeItemIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, format: int64 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        idempotencyKey: { type: string, maxLength: 64 }
    Payment:
      type: object
      required: [id, transactionNo, transactionType, amount, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        transactionNo: { type: string }
        transactionType: { type: string, enum: [PAYMENT, REFUND] }
        amount: { type: number, multipleOf: 0.01 }
        status: { type: string, enum: [SUCCESS, FAILED] }
        createdAt: { type: string, format: date-time }
    PaymentEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Payment' }
