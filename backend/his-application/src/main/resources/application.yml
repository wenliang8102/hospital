server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: hospital-his
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/his?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:his}
    password: ${DB_PASSWORD:his_dev_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: Hospital HIS
    version: 0.1.0


his:
  security:
    jwt:
      issuer: ${HIS_JWT_ISSUER:hospital-his}
      secret: ${HIS_JWT_SECRET:change-this-development-secret-before-production-2026}
      ttl: ${HIS_JWT_TTL:PT8H}
  bootstrap-admin:
    username: ${HIS_BOOTSTRAP_ADMIN_USERNAME:admin}
    display-name: ${HIS_BOOTSTRAP_ADMIN_DISPLAY_NAME:系统管理员}
    password: ${HIS_BOOTSTRAP_ADMIN_PASSWORD:}
